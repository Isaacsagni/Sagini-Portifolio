<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Isaac Sagini | Technology, Consulting & Research</title>
    <meta name="description" content="Explore Isaac Sagini's professional portfolio in software development, information technology, consulting, data analysis and research.">
    <meta name="author" content="Isaac Sagini">
    <meta name="theme-color" content="#101827">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        :root {
            --ink: #101827;
            --ink-soft: #19263a;
            --accent: #0891b2;
            --accent-light: #cffafe;
            --paper: #ffffff;
            --surface: #f4f7fb;
            --muted: #64748b;
            --line: #e2e8f0;
            --radius: 18px;
            --shadow: 0 18px 50px rgba(16, 24, 39, .08);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 90px; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
            line-height: 1.75;
        }

        h1, h2, h3, h4, h5, .brand {
            font-family: "Manrope", sans-serif;
            letter-spacing: -.035em;
        }

        a { text-decoration: none; }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            color: var(--ink);
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -.05em;
        }

        .brand span { color: var(--accent); }

        .navbar { padding: 16px 0; }

        .navbar-nav .nav-link {
            color: #475569;
            font-size: .93rem;
            font-weight: 600;
            padding: 10px 13px !important;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active { color: var(--accent); }

        .btn-main {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            padding: 13px 21px;
            border: 1px solid var(--accent);
            border-radius: 9px;
            background: var(--accent);
            color: white;
            font-weight: 700;
            transition: .2s ease;
        }

        .btn-main:hover {
            background: #0e7490;
            border-color: #0e7490;
            color: white;
            transform: translateY(-2px);
        }

        .btn-outline-main {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: var(--ink);
        }

        .btn-outline-main:hover {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }

        .hero {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 85% 15%, rgba(8,145,178,.19), transparent 34%),
                linear-gradient(135deg, #101827 0%, #17263b 70%, #102b3b 100%);
            color: white;
            padding: 105px 0 100px;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 380px;
            height: 380px;
            right: -150px;
            bottom: -220px;
            border: 1px solid rgba(103,232,249,.22);
            border-radius: 50%;
            box-shadow: 0 0 0 45px rgba(103,232,249,.025),
                        0 0 0 90px rgba(103,232,249,.025);
            pointer-events: none;
        }

        .hero-content { position: relative; z-index: 1; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #67e8f9;
            text-transform: uppercase;
            letter-spacing: .13em;
            font-size: .76rem;
            font-weight: 800;
        }

        .eyebrow::before {
            content: "";
            display: inline-block;
            width: 25px;
            height: 2px;
            background: currentColor;
        }

        .hero h1 {
            max-width: 800px;
            margin: 23px 0;
            font-size: clamp(2.65rem, 5.5vw, 5rem);
            font-weight: 800;
            line-height: 1.09;
            color: white;
        }

        .hero h1 span { color: #67e8f9; }

        .hero-description {
            max-width: 660px;
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.9;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .hero .btn-outline-main {
            color: white;
            border-color: #64748b;
        }

        .hero .btn-outline-main:hover {
            color: var(--ink);
            background: white;
            border-color: white;
        }

        .hero-note {
            margin-top: 28px
